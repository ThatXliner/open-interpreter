name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: "3.10"
    - name: Install build tools
      run: |
        python -m pip install --upgrade "pip>=26.2.2" "certifi>=2026.10.19" "poetry==1.6.1"
    - name: Install dependencies
      run: poetry install --no-interaction
    - name: Build package
      run: poetry build
    - name: Test HTTP trust without credentials or model execution
      run: poetry run pytest -q tests/test_tls_security.py
